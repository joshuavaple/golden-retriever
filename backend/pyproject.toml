[project]
name = "golden-retriever-backend"
version = "0.1.0"
description = "Local API for AI-assisted question suggestions in golden-retriever"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "pydantic-settings>=2.5",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
